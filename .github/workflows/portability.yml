name: Service portability

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Build production solver
        run: npm run native:build:linux
      - name: Build native tests with assertions enabled
        run: cmake -S native -B native/build-tests -DCMAKE_BUILD_TYPE=Debug && cmake --build native/build-tests --parallel
      - run: ctest --test-dir native/build-tests --output-on-failure
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:services
      - name: Verify warehouse PostgreSQL and SQLite migration
        if: matrix.os == 'ubuntu-24.04'
        run: npm run test:warehouse:postgres
      - name: Build and exercise independent Docker services
        if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
        run: npm run test:docker

  simulator:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Build complete Linux simulator stack
        id: build-simulator
        run: docker compose -f compose.yaml -f compose.simulator.yaml build
      - name: Verify physics, streaming and recovery through real services
        run: npm run test:container
      - name: Verify camera pickup and safety in Webots
        if: ${{ !cancelled() && steps.build-simulator.outcome == 'success' }}
        env:
          GPO_WEBOTS_TEST_IMAGE: gpo-webots:local
        run: |
          npm run test:delivery:vision
          npm run test:delivery:safety
          npm run test:warehouse:delivery
